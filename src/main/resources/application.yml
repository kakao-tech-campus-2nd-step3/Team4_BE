spring:
  application:
    name: Team4_BE
  messages:
    encoding: UTF-8

  datasource:
    #url: jdbc:h2:mem:testdb
    url: jdbc:mysql://linkfitdatabase-container:3306/linkfitdatabase?useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
    #driver-class-name: org.h2.Driver
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: linkfituser
    password: {LINKFIT_DB_PASSWORD}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
      format_sql: true
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

jwt:
  expiration-time: 1800000
  master:
    token:
      user: mastertoken-user
      trainer: mastertoken-trainer
    id: 1
    role:
      user: user
      trainer: trainer

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: nurspace-bucket
    stack:
      auto: false

kakao:
  api-key: ${KAKAO_API_KEY}
  address-search-url: https://dapi.kakao.com/v2/local/search/address.json

default-image-url: https://nurspace-bucket.s3.ap-northeast-2.amazonaws.com/default_profile.png